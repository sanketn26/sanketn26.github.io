site_name: Sanket — Learning in public
site_description: Firsthand engineering notes shaped with AI into free, practical learning material.
site_author: Sanket Naik
site_url: https://sanketn26.github.io/
repo_url: https://github.com/sanketn26/sanketn26.github.io
repo_name: sanketn26/sanketn26.github.io
copyright: Copyright &copy; Sanket Naik
use_directory_urls: true

hooks:
  - hooks/sitemap.py

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Note Courses: note-courses.md
  - Projects: projects.md
  - Articles: articles.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sanketn26
      name: Sanket on GitHub
    - icon: fontawesome/brands/medium
      link: https://medium.com/@sanketn
      name: Sanket on Medium
