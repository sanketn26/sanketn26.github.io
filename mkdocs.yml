site_name: Sanket
site_description: Open-source experiments, five engineering courses, and an archive of writing on distributed systems, data, observability, developer tools, and AI.
site_author: Sanket Naik
site_url: https://sanketn26.github.io/
repo_url: https://github.com/sanketn26/sanketn26.github.io
repo_name: sanketn26/sanketn26.github.io
copyright: Copyright &copy; Sanket Naik
use_directory_urls: true

hooks:
  - hooks/sitemap.py

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Courses: notes-2-courses.md
  - Projects: projects.md
  - Writing: articles.md
  - About: about.md
  - GitHub ↗: https://github.com/sanketn26

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sanketn26
      name: Sanket on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/sanketn/
      name: Sanket on LinkedIn
    - icon: fontawesome/brands/medium
      link: https://medium.com/@sanketn
      name: Sanket on Medium
